<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Workout Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.35)),
                        url('/static/images/gym-bg.jpg') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .nav-bar {
            position: absolute;
            top: 1rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
        }

        .nav-bar a {
            text-decoration: none;
            color: #1e293b;
            background: rgba(255, 255, 255, 0.85);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }

        .nav-bar a:hover {
            background: #ffffff;
            color: #2563eb;
        }

        .form-card {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            padding: 2.25rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        .title-container {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .title-container h1 {
            font-size: 1.55rem;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.4rem;
        }

        input, select {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #1e293b;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.75rem;
            background: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="/view-all-users">📋 Admin Dashboard</a>
        <a href="/docs" target="_blank">⚡ API Docs</a>
    </div>

    <div class="form-card">
        <div class="title-container">
            <h1>💪 FitBuddy - AI Workout Generator</h1>
        </div>

        <form action="/generate" method="POST">
            <div class="form-group">
                <label for="username">Name:</label>
                <input type="text" id="username" name="username" placeholder="e.g. Alex Morgan" required>
            </div>

            <div class="form-group">
                <label for="user_id">User ID:</label>
                <input type="number" id="user_id" name="user_id" placeholder="e.g. 101" required>
            </div>

            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="10" max="100" placeholder="e.g. 28" required>
            </div>

            <div class="form-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" step="0.1" id="weight" name="weight" min="20" max="300" placeholder="e.g. 68.5" required>
            </div>

            <div class="form-group">
                <label for="goal">Fitness Goal:</label>
                <input type="text" id="goal" name="goal" placeholder="e.g., weight loss, flexibility, muscle gain" required>
            </div>

            <div class="form-group">
                <label for="intensity">Workout Intensity:</label>
                <select id="intensity" name="intensity" required>
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Generate Plan</button>
        </form>
    </div>
</body>
</html>
